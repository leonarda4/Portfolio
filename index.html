<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#ffffff" />
    <meta name="color-scheme" content="light dark" />
    <link rel="preload" as="image" type="image/svg+xml" href="/assets/theme/sun.svg" fetchpriority="high" />
    <link rel="preload" as="image" type="image/svg+xml" href="/assets/theme/stars.svg" fetchpriority="high" />
    <script>
      if (!location.hash || /^#\/(?:home|work|play|about|contact|project\/project-three)?$/.test(location.hash)) {
        for (const app of ['paperclip', 'harmony', 'interconnect']) {
          const preload = document.createElement('link');
          preload.rel = 'preload'; preload.as = 'image'; preload.type = 'image/webp';
          preload.href = '/assets/tomsoft/cover/' + app + '-screen.webp';
          preload.fetchPriority = 'high'; document.head.appendChild(preload);
        }
      }
    </script>
    <script>
      (() => {
        let preference = 'system';
        try {
          const stored = localStorage.getItem('portfolio-theme');
          if (stored === 'light' || stored === 'dark') preference = stored;
        } catch {}
        let systemDark = false;
        try { systemDark = window.matchMedia?.('(prefers-color-scheme: dark)').matches || false; } catch {}
        const theme = preference === 'system' ? (systemDark ? 'dark' : 'light') : preference;
        document.documentElement.dataset.theme = theme;
        document.documentElement.style.colorScheme = theme;
        document.querySelector('meta[name="theme-color"]').setAttribute('content', theme === 'dark' ? '#161616' : '#ffffff');
      })();
    </script>
    <link rel="icon" type="image/png" sizes="32x32" href="/assets/theme/sun-32.png" />
    <link rel="icon" type="image/svg+xml" sizes="any" href="/assets/theme/sun.svg" />
    <link rel="apple-touch-icon" sizes="180x180" href="/assets/theme/sun-180.png" />
