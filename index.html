    <link rel="preload" as="image" type="image/webp" href="/assets/tomsoft/cover/paperclip-screen.webp" fetchpriority="high" />
    <link rel="preload" as="image" type="image/webp" href="/assets/tomsoft/cover/harmony-screen.webp" fetchpriority="high" />
    <link rel="preload" as="image" type="image/webp" href="/assets/tomsoft/cover/interconnect-screen.webp" fetchpriority="high" />
    <script>
      (() => {
        let preference = 'system';
        try {
          const stored = localStorage.getItem('portfolio-theme');
          if (stored === 'light' || stored === 'dark') preference = stored;
        } catch {}
        let systemDark = false;
        try { systemDark = window.matchMedia?.('(prefers-color-scheme: dark)').matches || false; } catch {}
        const theme = preference === 'system' ? (systemDark ? 'dark' : 'light') : preference;
        document.documentElement.dataset.theme = theme;
        document.documentElement.style.colorScheme = theme;
        document.querySelector('meta[name="theme-color"]').setAttribute('content', theme === 'dark' ? '#161616' : '#ffffff');
      })();
    </script>
