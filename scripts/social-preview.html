<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Portfolio sharing artwork</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Lacquer&display=swap">
  <link rel="stylesheet" href="../design-system/portfolio.css">
  <style>
    * { box-sizing:border-box; }
    body { margin:0; }
    .preview { position:relative; width:1200px; height:630px; overflow:hidden; background:#161616; color:#e5e5e5; font-family:var(--font-family); }
    .identity { position:absolute; left:72px; top:70px; }
    h1 { margin:0; font-size:64px; line-height:1.15; font-weight:500; letter-spacing:-.035em; }
    .role { margin:18px 0 0; font-size:28px; line-height:1.4; color:#aaa; }
    .statement { position:absolute; left:72px; top:300px; margin:0; font-size:48px; line-height:1.28; letter-spacing:-.025em; }
    .statement span { display:block; margin-top:8px; color:var(--color-accent); font-size:54px; letter-spacing:0; }
    .sun { position:absolute; left:880px; top:55px; }
    .crayon { position:absolute; width:48px; height:228px; }
    .crayon img { display:block; }
    .blue { left:880px; top:340px; transform:rotate(37deg); }
    .peach { left:1000px; top:345px; transform:rotate(65deg); }
    .caption { position:absolute; bottom:56px; left:72px; margin:0; color:#aaa; font-size:20px; line-height:1.4; }
  </style>
</head>
<body>
  <main class="preview">
    <div class="identity"><h1>Leonarda Lovrić</h1><p class="role">Product designer</p></div>
    <p class="statement">Thinking in systems<span class="accent-type">&amp; playing with tech.</span></p>
    <img class="sun" src="../public/assets/theme/sun.svg" alt="">
    <div class="crayon blue"><img src="../public/assets/about/figma/fcd69.svg" alt=""></div>
    <div class="crayon peach"><img src="../public/assets/about/figma/991b9.svg" alt=""></div>
    <p class="caption">Selected work &amp; experiments</p>
  </main>
</body>
</html>
